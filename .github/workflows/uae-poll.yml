name: UAE опрос линий

# НЕПРЕРЫВНЫЙ ОПРОС МНОГИХ КОНТОР.
#
# Одна задача живёт 5.5 часа (предел GitHub -- 6) и опрашивает изнутри
# каждые 3 минуты. В конце она сама запускает свою копию: по документации
# GitHub события workflow_dispatch и repository_dispatch создают запуск даже
# от GITHUB_TOKEN («always create workflow runs»), личный токен не нужен --
# достаточно permissions: actions: write. Очередь uae-poller держит копию
# в ожидании, пока текущая задача не закончится, так что покрытие сплошное.
#
# Ежечасный cron остаётся сторожевым: замерено, что GitHub исполняет ~10%
# запрошенных запусков расписания, поэтому как ОСНОВНОЙ механизм он не годится
# (P(ни одного запуска за 5.5 ч) ≈ 0.9^5 ≈ 59%), но цепочку после сбоя чинит.
# Когда матчей в ближайшие 72 часа нет, poll.py выходит сразу, и копия НЕ
# запускается -- иначе цепочка крутилась бы вхолостую; её поднимет cron.
#
# Стоимость: репозиторий публичный, минуты Actions не тарифицируются.
#
# Что ищем: максимальная цена среди контор, где можно поставить, против
# справедливой цены (консенсус независимых операторов либо прямая цена
# Pinnacle, берётся более осторожная). Прогнозная модель здесь НЕ участвует --
# на 717 исходах проверено, что её перевес анти-предиктивен (ROI -23.1%).
on:
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Сколько минут крутиться (по умолчанию 330 = 5.5 ч)'
        type: string
        default: '330'
      send:
        description: 'Слать находки в Telegram'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

# ОТДЕЛЬНАЯ ОЧЕРЕДЬ. Общий замок uae-repo-write здесь использовать нельзя:
# задача живёт часами и заблокировала бы расчёт, CLV и подведение итогов.
# Запись в репозиторий делается редкими пачками внутри и конфликты
# разруливает своим ретраем с rebase. GitHub держит в очереди группы не
# больше одного ожидающего запуска -- лишние cron-срабатывания не копятся.
concurrency:
  group: uae-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Настроить git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Опрос
        id: poll
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINUTES: ${{ inputs.minutes || '330' }}
        run: |
          # Флаг отправки: по расписанию всегда шлём, вручную -- по галочке.
          SEND="--send"
          if [ "${{ inputs.send }}" = "false" ]; then SEND=""; fi
          set +e
          python src/poll.py --minutes "$MINUTES" $SEND --commit 2>&1 | tee poll.log
          CODE=${PIPESTATUS[0]}
          set -e
          # Не запускать копию, если матчей в ближайшие 72 часа нет:
          # цепочка крутилась бы вхолостую. Её поднимет сторожевой cron.
          if grep -q "матчей нет, выхожу" poll.log; then
            echo "idle=true" >> "$GITHUB_OUTPUT"
          else
            echo "idle=false" >> "$GITHUB_OUTPUT"
          fi
          exit $CODE

      - name: Запустить следующую копию
        if: always() && steps.poll.outputs.idle != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run uae-poll.yml --ref "${{ github.ref_name }}" \
            -f minutes=330 -f send=true \
            && echo "копия поставлена в очередь" \
            || echo "не удалось поставить копию -- дождёмся cron"

      - name: Сообщить о падении
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Если упало до установки зависимостей, requests ещё нет -- а без него
          # не отправится и само уведомление о падении.
          python -m pip install -q requests >/dev/null 2>&1 || true
          python -c "
          from telegram_sender import send_message
          send_message('⚠️ Опрос линий ОАЭ упал или не смог сохранить снимки. Смотри лог прогона.')
          "
