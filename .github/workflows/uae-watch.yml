name: UAE сторож линии

# Двухступенчатая схема. Полный расчёт переобучает модель заново перед каждым
# игровым днём (около сотни подгонок) и занимает ~2 минуты — гонять его каждые
# полчаса значит выйти за бесплатный лимит Actions. Поэтому сначала работает
# сторож: три запроса, голая стандартная библиотека, без pip install, ~10 секунд.
# Полный прогон запускается, только если сторож нашёл повод.
#
# Поводы: новый матч в расписании, БЕТСИТИ открыла линию, сдвиг цены больше 2%
# у Pinnacle или у БЕТСИТИ. Сдвиг острой линии — главный: валуй у мягкой конторы
# живёт ровно в окне, когда острый рынок уже уехал, а мягкий ещё не догнал.
#
# РАСПИСАНИЕ И ЧЕСТНАЯ ПРАВДА О НЁМ. GitHub дросселирует cron на приватных
# репозиториях: замерено 26 фактических прогонов за 7 дней против 259
# запрошенных, то есть исполняется около 10%. Провалы между проверками
# доходят до 5.5 часов. Минуты Actions при этом почти не тратятся
# (~145 из 2000 в месяц) — упирается не в бюджет, а в планировщик.
#
# Раз запросы исполняются выборочно, их плотность влияет на ожидаемое число
# фактических запусков. Поэтому в окно, где ценность максимальна, запросов
# подаётся втрое больше. Окно выбрано не наугад: матчи начинаются в 17:45
# и 20:15 по Дубаю (13:45 и 16:15 UTC), а по Kaunitz и др. (2017) ставки
# за 1-5 часов до начала дали +8.5% против +3.5% на закрывающих линиях.
# Это ровно то окно, в котором живёт ярус 1 — единственный, который играется.
#
# Каждый прогон сторожа — около 30 секунд, поэтому уплотнение почти
# ничего не стоит: даже если исполнятся все запросы, выйдет ~90 минут
# в сутки при неиспользуемом остатке бюджета.
on:
  schedule:
    - cron: '*/10 9-17 * * *'    # плотное окно: 13:00-21:00 по Дубаю
    - cron: '*/30 5-8,18-21 * * *'
    - cron: '13 22,1,4 * * *'
  repository_dispatch:
    types: [uae-watch, run-all]
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Запустить полный расчёт независимо от сторожа'
        type: boolean
        default: false

permissions:
  contents: write

# ОДНА ОЧЕРЕДЬ НА ВСЕ ВОРКФЛОУ. Раньше у каждого была своя, и они
# коммитили в main одновременно: при конфликте в state.json или
# bets_log.csv rebase падал, "|| true" глотал ошибку, push отклонялся —
# и коммит терялся молча. Эти файлы не сливаются автоматически.
concurrency:
  group: uae-repo-write
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      reasons: ${{ steps.check.outputs.reasons }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # без cache: pip здесь не нужен, сторож на стандартной библиотеке

      - name: Проверить изменения
        id: check
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          OUT=$(python src/watch.py --json)
          CODE=$?
          set -e
          echo "$OUT"
          # Сторож упал -> пустой вывод. Полный расчёт всё равно запускаем:
          # лучше лишний прогон, чем пропущенный тур из-за сбоя сторожа.
          if [ -z "$OUT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reasons=сторож упал, страхуемся полным расчётом" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(python -c "import json,sys; print(str(json.loads(sys.argv[1])['changed']).lower())" "$OUT")
          REASONS=$(python -c "import json,sys; print(' | '.join(json.loads(sys.argv[1])['reasons'])[:400].replace(chr(10),' '))" "$OUT")
          if [ "${{ inputs.force_full }}" = "true" ]; then CHANGED=true; REASONS="запуск вручную"; fi
          # Текст причины произволен (названия команд из API): пишем через
          # heredoc-разделитель, иначе перенос строки сломал бы key=value.
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          {
            echo "reasons<<WF_EOF"
            echo "$REASONS"
            echo "WF_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::changed=$CHANGED"

      # Снимок коммитим ДО полного расчёта, чтобы вторая работа его увидела
      # при своём checkout и не сравнивала с устаревшим состоянием.
      - name: Commit snapshot
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state.json 2>/dev/null || true
          git diff --cached --quiet || {
            git commit -m "watch: снимок $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # Отдельные ретраи: rebase может не сойтись, а "|| true" это
            # прятал и push молча отклонялся. Файлы состояния не сливаются,
            # поэтому при конфликте берём СВОЮ версию и пробуем снова.
            for i in 1 2 3; do
              git pull --rebase --autostash origin ${{ github.ref_name }} || {
                git checkout --ours state.json data/bets_log.csv 2>/dev/null || true
                git add -A state.json data/bets_log.csv 2>/dev/null || true
                git rebase --continue || git rebase --abort || true
              }
              git push && break
              echo "push $i не прошёл, повтор"
              sleep 5
            done
          }

  full:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      # WATCH_REASONS передаётся переменной окружения, а не подстановкой ${{ }}
      # в тело скрипта: в нём названия команд из внешнего API, и кавычка или
      # $(...) внутри выполнилась бы как код от имени воркфлоу.
      - name: Полный расчёт и отправка
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
          WATCH_REASONS: ${{ needs.watch.outputs.reasons }}
        run: |
          echo "повод: $WATCH_REASONS"
          python bot.py --days-back 21

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state.json data/matches.csv data/shots.csv data/bets_log.csv data/shots_raw.jsonl.gz 2>/dev/null || true
          git diff --cached --quiet || {
            git commit -m "bets: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # Отдельные ретраи: rebase может не сойтись, а "|| true" это
            # прятал и push молча отклонялся. Файлы состояния не сливаются,
            # поэтому при конфликте берём СВОЮ версию и пробуем снова.
            for i in 1 2 3; do
              git pull --rebase --autostash origin ${{ github.ref_name }} || {
                git checkout --ours state.json data/bets_log.csv 2>/dev/null || true
                git add -A state.json data/bets_log.csv 2>/dev/null || true
                git rebase --continue || git rebase --abort || true
              }
              git push && break
              echo "push $i не прошёл, повтор"
              sleep 5
            done
          }
