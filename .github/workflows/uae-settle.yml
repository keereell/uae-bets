name: UAE расчёт и сводка

# Считает сыгравшие ставки и присылает сводку: CLV, ROI, разбивку по ярусам.
# 19:23 UTC = 23:23 по Дубаю — последний матч дня (20:15 местного) закончился
# больше часа назад, счёт уже проставлен.
on:
  schedule:
    - cron: '23 19 * * *'
  repository_dispatch:
    types: [uae-settle, run-all]
  workflow_dispatch:
    inputs:
      dry:
        description: 'Только посчитать, не отправлять'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: uae-settle
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Рассчитать и прислать сводку
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python bot.py --mode settle ${{ (inputs.dry == true) && '--dry' || '' }}
      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/bets_log.csv data/matches.csv data/shots.csv data/shots_raw.jsonl.gz 2>/dev/null || true
          git diff --cached --quiet || {
            git commit -m "settle: расчёт $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          }
