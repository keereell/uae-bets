name: UAE расчёт и сводка

# Считает сыгравшие ставки и присылает сводку: CLV, ROI, разбивку по ярусам.
# 19:23 UTC = 23:23 по Дубаю — последний матч дня (20:15 местного) закончился
# больше часа назад, счёт уже проставлен.
on:
  schedule:
    - cron: '23 19 * * *'
  repository_dispatch:
    types: [uae-settle, run-all]
  workflow_dispatch:
    inputs:
      dry:
        description: 'Только посчитать, не отправлять'
        type: boolean
        default: false

permissions:
  contents: write

# ОДНА ОЧЕРЕДЬ НА ВСЕ ВОРКФЛОУ. Раньше у каждого была своя, и они
# коммитили в main одновременно: при конфликте в state.json или
# bets_log.csv rebase падал, "|| true" глотал ошибку, push отклонялся —
# и коммит терялся молча. Эти файлы не сливаются автоматически.
concurrency:
  group: uae-repo-write
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Рассчитать и прислать сводку
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python bot.py --mode settle ${{ (inputs.dry == true) && '--dry' || '' }}
      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/bets_log.csv data/matches.csv data/shots.csv data/shots_raw.jsonl.gz 2>/dev/null || true
          git diff --cached --quiet || {
            git commit -m "settle: расчёт $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # Отдельные ретраи: rebase может не сойтись, а "|| true" это
            # прятал и push молча отклонялся. Файлы состояния не сливаются,
            # поэтому при конфликте берём СВОЮ версию и пробуем снова.
            for i in 1 2 3; do
              git pull --rebase --autostash origin ${{ github.ref_name }} || {
                git checkout --ours state.json data/bets_log.csv 2>/dev/null || true
                git add -A state.json data/bets_log.csv 2>/dev/null || true
                git rebase --continue || git rebase --abort || true
              }
              git push && break
              echo "push $i не прошёл, повтор"
              sleep 5
            done
          }
