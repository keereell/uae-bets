name: UAE Pro League bets

# Матчи Про-Лиги ОАЭ начинаются в 17:45 и 20:15 по Дубаю, то есть
# в 13:45 и 16:15 UTC. Два запуска в день:
#   09:17 UTC (13:17 Дубай) — утренний обзор, линия уже открыта
#   12:47 UTC (16:47 Дубай) — примерно за час до первого матча
#
# ПОЧЕМУ НЕ РОВНЫЙ ЧАС: GitHub Actions задерживает задачи, поставленные на
# :00, на 5-30 минут — в это время стартуют тысячи чужих воркфлоу.
# Нечётная минута попадает в тихую очередь и запускается за 1-3 минуты.
#
# ПОЧЕМУ ЗА ЧАС ДО МАТЧА: валуй у мягкой конторы живёт в лаге — острая линия
# уже сдвинулась, а БЕТСИТИ ещё нет. У Kaunitz и др. (2017) реальные ставки
# за 1-5 часов до начала дали +8.5%, а на закрывающих линиях только +3.5%.
# Частые проверки живут в uae-watch.yml (каждые 30 минут, полный расчёт только
# при изменениях). Здесь остаются два гарантированных прогона в день на случай,
# если сторож что-то пропустит: он сравнивает со снимком, и при сбое снимка
# изменение можно не заметить.
on:
  schedule:
    - cron: '17 9 * * *'
    - cron: '47 12 * * *'
  # Внешний триггер на случай, если планировщик GitHub пропустит день.
  repository_dispatch:
    types: [uae-bets, run-all]
  workflow_dispatch:
    inputs:
      force:
        description: 'Прислать даже уже отправленные ставки'
        type: boolean
        default: false
      dry:
        description: 'Ничего не отправлять, только посчитать'
        type: boolean
        default: false

# Бот коммитит обратно data/matches.csv, data/shots.csv и state.json.
permissions:
  contents: write

# Два одновременных запуска подрались бы за state.json.
concurrency:
  group: uae-bets
  cancel-in-progress: false

jobs:
  bets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python bot.py \
            ${{ (inputs.force == true) && '--force' || '' }} \
            ${{ (inputs.dry == true) && '--dry' || '' }}

      - name: Commit updated data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # picks.csv и forecast.csv не коммитим: они пересоздаются каждым
          # прогоном и дают конфликт при любом локальном запуске.
          git add -A state.json data/matches.csv data/shots.csv data/bets_log.csv data/shots_raw.jsonl.gz 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit -m "bets: run $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # ветка могла уйти вперёд, пока шёл прогон
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
